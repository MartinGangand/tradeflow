[build-system]
requires = ["setuptools>=61.0, <=72.1.0", "toml"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeflow"
version = "1.2.0"
dependencies = [
    "matplotlib>=3.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "statsmodels>=0.12.2",
    "scipy>=1.9.0"
]
authors = [
    { name="Martin Gangand", email="martin.gangand@gmail.com" },
]
description = "A package to simulate autocorrelated time series of signs"
readme = "README.md"
requires-python = ">=3.8, <3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://martingangand.github.io/tradeflow/"

[tool.cibuildwheel]
enable = ["pypy", "pypy-eol"]

[tool.cibuildwheel.linux]
archs = ["auto", "auto32"]

[tool.ruff]
line-length = 320

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "Q",    # flake8-quotes
    "TID",  # flake8-tidy-imports
    "FLY",  # flynt
    "I",    # isort
    "PD",   # pandas-vet
    "PERF", # perflint
    "E",    # pycodestyle/error
    "W",    # pycodestyle/warning
    "F",    # pyflakes
    "PGH",  # pygrep-hooks
    "PLE",  # pylint/error
    "UP",   # pyupgrade
    "RUF012",  # ruff: mutable-class-default
    "RUF100",  # ruff: unused-noqa
]
ignore = [
    # flake8-bugbear
    "B006",    # Do not use mutable data structures for argument defaults
    "B007",    # Loop control variable not used within loop body
    "B011",    # Do not `assert False` (`python -O` removes these calls), raise `AssertionError()`
    "B023",    # Function definition does not bind loop variable
    "B028",    # No explicit `stacklevel` keyword argument found
    "B904",    # Within an `except` clause distinguish raised exceptions from errors in exception handling
    "B905",    #`zip()` without an explicit `strict=` parameter
    # flake8-comprehensions
    "C408",    # Unnecessary `dict()` call (rewrite as a literal)
    # flake8-implicit-str-concat
    "ISC002",  # Implicitly concatenated string literals over multiple lines
    # flake8-pie
    "PIE790",  # Unnecessary `pass` statement
    # perflint
    "PERF401", # Use a list comprehension to create a transformed list
    # pycodestyle/error
    "E241",    # Multiple spaces after comma
    "E265",    # Block comment should start with `# `
    "E266",    # Too many leading `#` before block comment
    "E302",    # TODO: Expected 2 blank lines, found 1
    "E402",    # Module level import not at top of file
    "E712",    # Avoid equality comparisons to `True` or `False`
    "E731",    # Do not assign a `lambda` expression, use a `def`
    "E741",    # Ambiguous variable name
    # pyflakes
    "F403",    # `from ... import *` used; unable to detect undefined names
    "F405",    # may be undefined, or defined from star imports
    "F821",    # Undefined name
    "F841",    # Local variable is assigned to but never used
    # pyupgrade
    "UP015" ,  # Unnecessary mode argument
]